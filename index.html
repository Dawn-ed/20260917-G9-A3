<!DOCTYPE html>
<html>
<head>
<title>G9湛-A3戶型設計導覽</title>
<meta charset="utf-8">
<meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
<meta property="og:title"content="G9湛-A3戶型設計導覽">
<meta property="og:image"content="img/pp.png">
<meta property="og:descripion"2026時工分室內設計 10CM Design-CHI">
<style> @-ms-viewport { width: device-width; } </style>
<link rel="stylesheet" href="vendor/reset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="multiple-scenes view-control-buttons">
<!-- 背景音樂標籤 (loop 為循環播放) -->
<audio id="bgm" src="QQ.wav" loop preload="auto"></audio>

<!-- 浮動音樂開關按鈕 -->
<button id="music-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; padding: 10px 15px; border-radius: 20px; border: none; background: rgba(0,0,0,0.7); color: white; cursor: pointer;">
  🎵 播放音樂
</button>
<div id="pano"></div>

<div id="sceneList">
  <ul class="scenes">
    
      <a href="javascript:void(0)" class="scene" data-id="0-">
        <li class="text">玄關</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="1-">
        <li class="text">客廳</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="2-">
        <li class="text">餐廳</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="3-">
        <li class="text">過道</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="4-1">
        <li class="text">次臥房1</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="5-2">
        <li class="text">次臥房2</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="6-">
        <li class="text">主臥房</li>
      </a>
    
      <a href="javascript:void(0)" class="scene" data-id="7--">
        <li class="text">主臥房-衣櫃</li>
      </a>
    
  </ul>
</div>

<div id="titleBar">
  <h1 class="sceneName"></h1>
</div>

<a href="javascript:void(0)" id="autorotateToggle">
  <img class="icon off" src="img/play.png">
  <img class="icon on" src="img/pause.png">
</a>

<a href="javascript:void(0)" id="fullscreenToggle">
  <img class="icon off" src="img/fullscreen.png">
  <img class="icon on" src="img/windowed.png">
</a>

<a href="javascript:void(0)" id="sceneListToggle">
  <img class="icon off" src="img/expand.png">
  <img class="icon on" src="img/collapse.png">
</a>

<a href="javascript:void(0)" id="viewUp" class="viewControlButton viewControlButton-1">
  <img class="icon" src="img/up.png">
</a>
<a href="javascript:void(0)" id="viewDown" class="viewControlButton viewControlButton-2">
  <img class="icon" src="img/down.png">
</a>
<a href="javascript:void(0)" id="viewLeft" class="viewControlButton viewControlButton-3">
  <img class="icon" src="img/left.png">
</a>
<a href="javascript:void(0)" id="viewRight" class="viewControlButton viewControlButton-4">
  <img class="icon" src="img/right.png">
</a>
<a href="javascript:void(0)" id="viewIn" class="viewControlButton viewControlButton-5">
  <img class="icon" src="img/plus.png">
</a>
<a href="javascript:void(0)" id="viewOut" class="viewControlButton viewControlButton-6">
  <img class="icon" src="img/minus.png">
</a>

<script src="vendor/screenfull.min.js" ></script>
<script src="vendor/bowser.min.js" ></script>
<script src="vendor/marzipano.js" ></script>

<script src="data.js"></script>
<script src="index.js"></script>
<script>
  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('music-btn');

  // 按鈕點擊切換播放/暫停
  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // 防止觸發全域點擊事件
    if (bgm.paused) {
      bgm.play();
      musicBtn.innerText = '🔊 暫停音樂';
    } else {
      bgm.pause();
      musicBtn.innerText = '🎵 播放音樂';
    }
  });

  // 使用者首次點擊網頁任意處時嘗試播放
  const startPlayOnFirstClick = () => {
    bgm.play().then(() => {
      musicBtn.innerText = '🔊 暫停音樂';
      document.removeEventListener('click', startPlayOnFirstClick);
    }).catch(err => {
      console.log('瀏覽器阻擋自動播放，等待按鈕觸發：', err);
    });
  };

  document.addEventListener('click', startPlayOnFirstClick, { once: true });
</script>
</body>
</html>

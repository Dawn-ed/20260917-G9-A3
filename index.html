<!-- 背景音樂標籤 -->
<audio id="bgm" src="QQ.mp3" loop preload="auto"></audio>

<!-- 音樂按鈕 (已提高層級避免被全景圖蓋住) -->
<button id="music-btn" style="position: fixed; bottom: 30px; right: 30px; z-index: 999999; padding: 12px 18px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.75); color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
  🎵 播放音樂
</button>

<!-- 音樂播放控制腳本 -->
<script>
  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('music-btn');

  // 設定音量為 60%
  bgm.volume = 0.6;

  // 嘗試播放音樂函式
  const playBgm = () => {
    bgm.play().then(() => {
      musicBtn.innerText = '🔊 暫停音樂';
      // 成功播放後，移除監聽避免重複觸發
      document.removeEventListener('click', userInteractionHandler);
      document.removeEventListener('touchstart', userInteractionHandler);
    }).catch(err => {
      // 若被瀏覽器阻擋自動播放，維持顯示「播放音樂」等待使用者點擊
      musicBtn.innerText = '🎵 播放音樂';
    });
  };

  // 1. 頁面載入時嘗試立即自動播放
  window.addEventListener('DOMContentLoaded', () => {
    playBgm();
  });

  // 2. 瀏覽器若阻擋，使用者點擊/觸控畫面任何地方時立即啟動
  const userInteractionHandler = () => {
    playBgm();
  };
  document.addEventListener('click', userInteractionHandler);
  document.addEventListener('touchstart', userInteractionHandler);

  // 3. 按鈕點擊手動切換開關
  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // 阻止事件冒泡
    if (bgm.paused) {
      bgm.play().then(() => {
        musicBtn.innerText = '🔊 暫停音樂';
      });
    } else {
      bgm.pause();
      musicBtn.innerText = '🎵 播放音樂';
    }
  });
</script>

</body>
